---
# ==============================================================================
# Kubernetes Deployment: BLUE Environment (v1.0 Baseline)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-blue
  labels:
    app: healthcare
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcare
      version: blue
  template:
    metadata:
      labels:
        app: healthcare
        version: blue
    spec:
      containers:
      - name: healthcare-app
        image: healthcare-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "250m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"

---
# ==============================================================================
# Kubernetes Deployment: GREEN Environment (v2.0 New Release)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-green
  labels:
    app: healthcare
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcare
      version: green
  template:
    metadata:
      labels:
        app: healthcare
        version: green
    spec:
      containers:
      - name: healthcare-app
        image: healthcare-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "250m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"

---
# ==============================================================================
# Kubernetes Service: NodePort Traffic Switchboard (Port 30080)
# Initially routes traffic to BLUE.
# Jenkins Stage 5 switches selector to `version: green`.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: healthcare-service
  labels:
    app: healthcare
spec:
  type: NodePort
  selector:
    app: healthcare
    version: blue
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
